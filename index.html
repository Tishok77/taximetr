<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таксометр</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>Таксометр</h1>
  <div class="topbar-actions">
    <button id="btn-settings" class="icon-btn" title="Настройки комиссий">Комиссии</button>
    <button id="btn-history" class="icon-btn" title="История смен">История</button>
  </div>
</header>

<main id="view-root"></main>

<!-- Экран: нет активной смены -->
<template id="tpl-start">
  <section class="screen">
    <h2>Начать смену</h2>
    <label class="field-label">Режим работы</label>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="flexible">Гибкий</button>
      <button class="mode-btn" data-mode="efficient">Эффективный</button>
    </div>
    <button id="btn-start-shift" class="btn btn-primary btn-lg">Начать смену</button>
  </section>
</template>

<!-- Экран: активная смена -->
<template id="tpl-shift">
  <section class="screen">
    <div class="status-badge" id="status-badge">На линии</div>

    <div class="mode-switch mode-switch-compact" id="shift-mode-switch">
      <button class="mode-btn" data-mode="flexible">Гибкий</button>
      <button class="mode-btn" data-mode="efficient">Эффективный</button>
    </div>

    <div class="timer-block">
      <div class="timer-label">Время смены</div>
      <div class="timer" id="timer-shift">00:00:00</div>
    </div>

    <div class="stats-grid">
      <div class="stat">
        <div class="stat-value" id="stat-orders-time">00:00:00</div>
        <div class="stat-label">В заказах</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-idle-time">00:00:00</div>
        <div class="stat-label">Простой</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-break-time">00:00:00</div>
        <div class="stat-label">Обед</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-distance">0.0 км</div>
        <div class="stat-label">Пробег</div>
      </div>
    </div>

    <div class="order-panel" id="order-panel">
      <!-- заполняется в JS в зависимости от состояния -->
    </div>

    <div class="action-row">
      <button id="btn-toggle-break" class="btn btn-secondary">Обед</button>
      <button id="btn-end-shift" class="btn btn-danger">Завершить смену</button>
    </div>

    <h3 class="orders-heading">Заказы за смену (<span id="orders-count">0</span>)</h3>
    <ul class="orders-list" id="orders-list"></ul>
  </section>
</template>

<!-- Экран: итог смены -->
<template id="tpl-summary">
  <section class="screen">
    <h2>Итоги смены</h2>
    <div class="summary-grid" id="summary-grid"></div>
    <h3 class="orders-heading">По режимам работы</h3>
    <div class="summary-grid" id="mode-breakdown-grid"></div>
    <h3 class="orders-heading">Заказы (<span id="summary-orders-count">0</span>)</h3>
    <ul class="orders-list" id="summary-orders-list"></ul>
    <button id="btn-close-summary" class="btn btn-primary btn-lg">Готово</button>
  </section>
</template>

<!-- Экран: настройки комиссий -->
<template id="tpl-settings">
  <section class="screen">
    <h2>Настройки комиссий</h2>
    <p class="settings-hint">Проценты вычитаются из суммы, которую вы вводите после заказа (цена поездки до комиссии) — так приложение считает реальный доход по каждому режиму.</p>

    <div class="export-box">
      <h3 class="orders-heading" style="margin-top:0">Гибкий режим</h3>
      <label class="field-label" for="comm-flexible-service">Комиссия сервиса, %</label>
      <input type="number" id="comm-flexible-service" step="0.01" min="0" max="100">
      <label class="field-label" for="comm-flexible-park">Комиссия парка, %</label>
      <input type="number" id="comm-flexible-park" step="0.01" min="0" max="100">
    </div>

    <div class="export-box">
      <h3 class="orders-heading" style="margin-top:0">Эффективный режим</h3>
      <label class="field-label" for="comm-efficient-service">Комиссия сервиса, %</label>
      <input type="number" id="comm-efficient-service" step="0.01" min="0" max="100">
      <label class="field-label" for="comm-efficient-mode">Комиссия режима, %</label>
      <input type="number" id="comm-efficient-mode" step="0.01" min="0" max="100">
      <label class="field-label" for="comm-efficient-park">Комиссия парка, %</label>
      <input type="number" id="comm-efficient-park" step="0.01" min="0" max="100">
    </div>

    <button id="btn-save-commissions" class="btn btn-primary btn-lg">Сохранить</button>
    <p class="export-status" id="commission-save-status"></p>
    <button id="btn-settings-back" class="btn btn-secondary btn-lg">На главный экран</button>
  </section>
</template>

<!-- Экран: история смен -->
<template id="tpl-history">
  <section class="screen">
    <h2>История смен</h2>

    <div class="export-box">
      <label class="field-label" for="input-sheets-url">Ссылка на Google Apps Script (для выгрузки в Google Таблицы)</label>
      <input type="url" id="input-sheets-url" placeholder="https://script.google.com/macros/s/.../exec">
      <div class="export-actions">
        <button id="btn-save-sheets-url" class="btn btn-secondary">Сохранить ссылку</button>
        <button id="btn-export-sheets" class="btn btn-primary">Выгрузить в Google Таблицы</button>
      </div>
      <p class="export-status" id="export-status"></p>
    </div>

    <ul class="shift-history-list" id="shift-history-list"></ul>
    <p class="empty-hint" id="history-empty-hint" hidden>Пока нет завершённых смен</p>
    <button id="btn-history-back" class="btn btn-secondary btn-lg">На главный экран</button>
  </section>
</template>

<!-- Модалка: оплата заказа -->
<div class="modal-overlay" id="modal-payment" hidden>
  <div class="modal">
    <h3>Оплата заказа</h3>
    <p class="modal-sub">Время: <span id="modal-order-time"></span> · Пробег: <span id="modal-order-distance"></span></p>
    <label class="field-label" for="input-payment">Сумма от агрегатора, ₽</label>
    <input type="number" id="input-payment" inputmode="decimal" min="0" step="1" placeholder="0" autofocus>
    <div class="modal-actions">
      <button id="btn-cancel-payment" class="btn btn-secondary">Отмена</button>
      <button id="btn-confirm-payment" class="btn btn-primary">Сохранить</button>
    </div>
  </div>
</div>

<script src="storage.js"></script>
<script src="geo.js"></script>
<script src="app.js"></script>
</body>
</html>
